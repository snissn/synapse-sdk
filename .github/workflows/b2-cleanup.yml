name: B2 construction cleanup

on:
  push:
    branches:
      - gpt56/issue-7-synapse-services-manager
    paths:
      - .github/workflows/b2-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt56/issue-7-synapse-services-manager
          fetch-depth: 0

      - name: Remove temporary construction files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/b2-finish.py \
            .github/workflows/gpt56-source-export.yml \
            .github/workflows/b2-finish.yml \
            .github/workflows/b2-finish-v2.yml \
            .github/workflows/b2-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove B2 construction workflows"
          git push origin HEAD:gpt56/issue-7-synapse-services-manager
