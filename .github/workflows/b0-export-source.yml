name: Export B0 source

on:
  push:
    branches:
      - gpt56/issue-5-boss-core-wire-format
    paths:
      - .github/workflows/b0-export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b0-source
          tar --exclude=.git --exclude=node_modules --exclude='**/dist' -czf /tmp/b0-source/repository.tar.gz .
          git rev-parse HEAD > /tmp/b0-source/source-head.txt
          cd /tmp/b0-source
          sha256sum repository.tar.gz source-head.txt > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: b0-source
          path: /tmp/b0-source/
          if-no-files-found: error
          retention-days: 1
