name: GPT56 B2 source export

on:
  push:
    branches:
      - gpt56/issue-7-synapse-services-manager
    paths:
      - .github/workflows/gpt56-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gpt56-source
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/gpt56-source/repository.tar.gz .
          git rev-parse HEAD > /tmp/gpt56-source/source-head.txt
          cd /tmp/gpt56-source
          sha256sum repository.tar.gz source-head.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gpt56-b2-source
          path: /tmp/gpt56-source/
          if-no-files-found: error
          retention-days: 1
