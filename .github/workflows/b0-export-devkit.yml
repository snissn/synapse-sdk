name: Export B0 development kit

on:
  push:
    branches:
      - gpt56/issue-5-boss-core-wire-format
    paths:
      - .github/workflows/b0-export-devkit.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact workspace
        run: pnpm install --no-frozen-lockfile

      - name: Package exact source and synapse-core dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b0-source /tmp/b0-deps /tmp/b0-pnpm
          tar --exclude=.git --exclude='**/node_modules' --exclude='**/dist' -czf /tmp/b0-source/repository.tar.gz .
          tar --dereference -C packages/synapse-core -czf /tmp/b0-deps/synapse-core-node-modules.tar.gz node_modules
          cp -aL "$PNPM_HOME/." /tmp/b0-pnpm/
          tar -C /tmp/b0-pnpm -czf /tmp/b0-deps/pnpm-home.tar.gz .
          git rev-parse HEAD > /tmp/b0-source/source-head.txt
          sha256sum /tmp/b0-source/* > /tmp/b0-source/SHA256SUMS
          sha256sum /tmp/b0-deps/* > /tmp/b0-deps/SHA256SUMS
          du -h /tmp/b0-source/* /tmp/b0-deps/*

      - uses: actions/upload-artifact@v4
        with:
          name: b0-source-exact
          path: /tmp/b0-source/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: b0-synapse-core-deps
          path: /tmp/b0-deps/
          if-no-files-found: error
          retention-days: 1
